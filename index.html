<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>


    <div class="calculator">
        <div class="display">
            
        </div>
        <div class="keyboard">
            <div class="numKeys">
                <div data-keyValue="1">1</div>
                <div data-keyValue="2">2</div>
                <div data-keyValue="3">3</div>
                <div data-keyValue="4">4</div>
                <div data-keyValue="5">5</div>
                <div data-keyValue="6">6</div>
                <div data-keyValue="7">7</div>
                <div data-keyValue="8">8</div>
                <div data-keyValue="9">9</div>
                <div data-keyValue="0">0</div>
            </div>
            <div class="funcKeys">
                <div data-keyValue="+">+</div>
                <div data-keyValue="-">-</div>
                <div data-keyValue="*">*</div>
                <div data-keyValue="/">/</div>
                <div data-keyValue="=">=</div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
